<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RYOSUKE YOSHIOKA</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Helvetica Neue', sans-serif;
      color: white;
    }

    .background {
      position: relative;
      width: 100%;
      height: 100vh;
      background-image: url('background.jpg'); /* 背景画像を適切に設定 */
      background-size: cover;
      background-position: center;
    }

    .name {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 36px;
      font-weight: bold;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
    }

    .bio {
      position: absolute;
      bottom: 20px;
      right: 20px;
      max-width: 300px;
      font-size: 16px;
      text-align: right;
      line-height: 1.4;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.6);
    }

    .nav {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 20px;
      font-size: 16px;
      font-weight: 500;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
    }

    .nav a {
      color: white;
      text-decoration: none;
      transition: opacity 0.3s;
    }

    .nav a:hover {
      opacity: 0.7;
    }
  </style>
</head>
<body>

<div class="background">
  <div class="nav">
    <a href="#about">About</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
  </div>

  <div class="name">RYOSUKE YOSHIOKA</div>

  <div class="bio">
    Passionate about technology and creativity.<br />
    Exploring the intersection of code, design, and impact.
  </div>
</div>

</body>
</html>
