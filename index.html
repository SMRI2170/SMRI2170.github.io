<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 Not Found</title>
  <style>
    body {
      margin: 0;
      background: radial-gradient(ellipse at center, #0d0d0d 0%, #000000 100%);
      font-family: 'Courier New', monospace;
      color: #fff;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      animation: twinkle 2s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    h1 {
      font-size: 6em;
      margin: 0;
      letter-spacing: 0.1em;
    }

    p {
      font-size: 1.5em;
      margin: 0.5em 0;
    }

    .astronaut {
      font-size: 2em;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    .home-btn {
      margin-top: 1.5em;
      padding: 0.5em 1.5em;
      font-size: 1em;
      background: #8e44ad;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .home-btn:hover {
      background: #732d91;
    }
  </style>
</head>
<body>
  <!-- ランダムな星 -->
  <script>
    for (let i = 0; i < 100; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.top = `${Math.random() * 100}vh`;
      star.style.left = `${Math.random() * 100}vw`;
      star.style.animationDuration = `${Math.random() * 2 + 1}s`;
      document.body.appendChild(star);
    }
  </script>

  <div class="astronaut">👨‍🚀</div>
  <h1>404</h1>
  <p>宇宙の彼方でページが迷子になりました。</p>
  <button class="home-btn" onclick="window.location.href='/'">ホームに戻る</button>
</body>
</html>
