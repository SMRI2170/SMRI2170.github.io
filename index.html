<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ゲームクリアで入場</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: black;
      color: white;
      font-family: sans-serif;
      text-align: center;
    }
    canvas {
      display: block;
      margin: 0 auto;
      background: #111;
      border: 2px solid white;
    }
    #mainContent {
      display: none;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>敵を全滅させるとサイトに入れます！</h1>
  <canvas id="gameCanvas" width="400" height="500"></canvas>

  <div id="mainContent">
    <h2>🎉 クリア！ようこそ！</h2>
    <p>ここからサイト本編の情報が見られます。</p>
    <p>GitHubや作品リンクなどをここに配置しましょう。</p>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let player = { x: 200, y: 450, width: 20, height: 20 };
    let bullets = [];
    let enemies = [];
    let keys = {};

    for (let i = 0; i < 5; i++) {
      enemies.push({ x: 60 + i * 60, y: 50, width: 20, height: 20, alive: true });
    }

    document.addEventListener("keydown", (e) => {
      keys[e.key] = true;
      if (e.key === " ") {
        bullets.push({ x: player.x + 8, y: player.y, speed: 5 });
      }
    });

    document.addEventListener("keyup", (e) => {
      keys[e.key] = false;
    });

    function update() {
      if (keys["ArrowLeft"]) player.x -= 5;
      if (keys["ArrowRight"]) player.x += 5;
      player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));

      bullets.forEach((b) => (b.y -= b.speed));

      bullets = bullets.filter((b) => b.y > 0);

      // 敵と衝突判定
      bullets.forEach((bullet) => {
        enemies.forEach((enemy) => {
          if (
            enemy.alive &&
            bullet.x < enemy.x + enemy.width &&
            bullet.x + 4 > enemy.x &&
            bullet.y < enemy.y + enemy.height &&
            bullet.y + 10 > enemy.y
          ) {
            enemy.alive = false;
            bullet.y = -10;
          }
        });
      });

      // 敵全滅判定
      if (enemies.every((e) => !e.alive)) {
        document.getElementById("gameCanvas").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // プレイヤー
      ctx.fillStyle = "white";
      ctx.fillRect(player.x, player.y, player.width, player.height);

      // 弾
      ctx.fillStyle = "red";
      bullets.forEach((b) => ctx.fillRect(b.x, b.y, 4, 10));

      // 敵
      ctx.fillStyle = "lime";
      enemies.forEach((e) => {
        if (e.alive) ctx.fillRect(e.x, e.y, e.width, e.height);
      });
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
