<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>プロフィールサイト</title>
  <style>
    :root {
      --base-color: #F4EBDA;
      --text-color: #262724;
      --accent-color: #A6B5A5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --base-color: #262724;
        --text-color: #F4EBDA;
        /* アクセントカラーはそのまま */
      }
    }

    body {
      background-color: var(--base-color);
      color: var(--text-color);
      font-family: 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 2rem;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    h1, h2, h3 {
      color: var(--accent-color);
    }

    a {
      color: var(--accent-color);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .profile-card {
      border: 2px solid var(--accent-color);
      padding: 2rem;
      border-radius: 1rem;
      max-width: 600px;
      margin: auto;
      background-color: rgba(166, 181, 165, 0.1); /* アクセントの淡い背景 */
    }
  </style>
</head>
<body>
  <div class="profile-card">
    <h1>吉岡 龍佑</h1>
    <p>立命館大学 / 情報理工学部 / セキュリティ・ネットワークコース</p>
    <p>興味: ゼロ知識証明 / IoT / AI / Webデザイン</p>
    <a href="https://github.com/yourusername">GitHubを見る</a>
  </div>
</body>
</html>
