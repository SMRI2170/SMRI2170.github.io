<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>勇者RYOSUKEの冒険</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Press Start 2P', cursive;
      margin: 0;
      padding: 0;
      /* 初期背景は草原 */
      background-image: url("https://opengameart.org/sites/default/files/grass.png");
      background-repeat: repeat;
      background-size: 32px 32px;
      transition: background-image 0.5s ease;
      animation: grassWind 6s ease-in-out infinite;
    }

    /* 背景ゆらぎアニメーション */
    @keyframes grassWind {
      0% { background-position: 0 0; }
      50% { background-position: 10px 0; }
      100% { background-position: 0 0; }
    }

    header {
      background: #222;
      padding: 20px;
      text-align: center;
      font-size: 14px;
      position: relative;
      z-index: 10;
    }
    /* 背景切り替えボタンエリア */
    .bg-switcher {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 20;
      display: flex;
      gap: 8px;
    }
    .bg-switcher button {
      font-family: 'Press Start 2P', cursive;
      font-size: 10px;
      padding: 6px 8px;
      background: #222;
      border: 2px solid #fff;
      color: #fff;
      cursor: pointer;
      border-radius: 4px;
      transition: background-color 0.3s;
    }
    .bg-switcher button:hover {
      background-color: #555;
    }
    .start-screen {
      text-align: center;
      padding: 100px 20px;
      position: relative;
      z-index: 5;
    }
    .start-button {
      font-size: 20px;
      padding: 10px 20px;
      background: #fff;
      color: #000;
      border: none;
      cursor: pointer;
    }
    .dialog-box {
      background: rgba(68, 68, 68, 0.8);
      border: 4px solid #fff;
      padding: 20px;
      margin: 20px auto;
      width: 80%;
      max-width: 600px;
      position: relative;
      z-index: 5;
      backdrop-filter: blur(3px);
    }
    .profile-section {
      padding: 20px;
      position: relative;
      z-index: 5;
    }

    /* キャラクター */
    #character {
      width: 64px;
      height: 64px;
      background-image: url("https://opengameart.org/sites/default/files/character_sprite.png"); /* キャラスプライトシート例 */
      background-repeat: no-repeat;
      position: fixed;
      bottom: 100px;
      left: 50%;
      margin-left: -32px;
      z-index: 30;
      image-rendering: pixelated; /* レトロ感UP */
      transition: transform 0.1s linear;
    }

    /* 移動ボタン */
    .move-buttons {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 40;
    }
    .move-buttons button {
      font-family: 'Press Start 2P', cursive;
      font-size: 16px;
      padding: 10px 20px;
      background: #222;
      border: 2px solid #fff;
      color: #fff;
      cursor: pointer;
      border-radius: 6px;
      user-select: none;
      transition: background-color 0.3s;
    }
    .move-buttons button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <header>🎮 勇者 RYOSUKE の 冒険記</header>

  <!-- 背景切り替えボタン -->
  <div class="bg-switcher" aria-label="背景切り替えボタン">
    <button type="button" onclick="changeBackground('grass')">草原</button>
    <button type="button" onclick="changeBackground('forest')">森</button>
    <button type="button" onclick="changeBackground('castle')">城</button>
  </div>

  <div class="start-screen">
    <p>PRESS START</p>
    <button class="start-button" onclick="document.querySelector('.main-content').style.display='block'; this.parentElement.style.display='none';">START</button>
  </div>

  <div class="main-content" style="display:none;">
    <section class="profile-section">
      <div class="dialog-box">
        <p>【名前】RYOSUKE</p>
        <p>【職業】アーキテクト</p>
        <p>【レベル】21</p>
        <p>【HP】108/120</p>
      </div>
    </section>

    <section class="profile-section">
      <div class="dialog-box">
        <p>🎯スキル</p>
        <ul>
          <li>HTML & CSS - レベル10</li>
          <li>JavaScript - レベル8</li>
          <li>React - レベル6</li>
          <li>Python - レベル9</li>
        </ul>
      </div>
    </section>

    <section class="profile-section">
      <div class="dialog-box">
        <p>🏰 宿屋へようこそ。お問合せは以下まで。</p>
        <p>📧 ryosuke@example.com</p>
      </div>
    </section>
  </div>

  <!-- キャラクター -->
  <div id="character"></div>

  <!-- 移動ボタン -->
  <div class="move-buttons" aria-label="キャラクター移動ボタン">
    <button type="button" id="leftBtn">← 左へ</button>
    <button type="button" id="rightBtn">右へ →</button>
  </div>

  <script>
    // 背景切り替え（背景画像＆アニメーションの切り替え）
    function changeBackground(type) {
      let url = "";
      let anim = "";
      switch(type) {
        case "grass":
          url = "https://opengameart.org/sites/default/files/grass.png";
          anim = "grassWind 6s ease-in-out infinite";
          break;
        case "forest":
          url = "https://opengameart.org/sites/default/files/forest_tile.png";
          anim = "forestWind 8s linear infinite";
          break;
        case "castle":
          url = "https://opengameart.org/sites/default/files/castle_tile.png";
          anim = "castleWind 10s linear infinite";
          break;
        default:
          url = "https://opengameart.org/sites/default/files/grass.png";
          anim = "grassWind 6s ease-in-out infinite";
      }
      document.body.style.backgroundImage = `url('${url}')`;
      document.body.style.animation = anim;
    }

    // 他の背景用アニメーション例
    const style = document.createElement('style');
    style.textContent = `
      @keyframes forestWind {
        0% { background-position: 0 0; }
        50% { background-position: 15px 5px; }
        100% { background-position: 0 0; }
      }
      @keyframes castleWind {
        0% { background-position: 0 0; }
        50% { background-position: 20px 10px; }
        100% { background-position: 0 0; }
      }
    `;
    document.head.appendChild(style);

    // キャラクター歩行アニメーション制御
    const char = document.getElementById("character");
    let frame = 0;
    let walking = false;
    let direction = 1; // 1 = 右向き, -1 = 左向き
    let animInterval = null;
    let posX = window.innerWidth / 2 - 32;

    // キャラ初期位置セット
    char.style.left = posX + "px";

    function startWalking(dir) {
      direction = dir;
      walking = true;
      char.style.transform = `scaleX(${dir})`; // 向き反転
      if (!animInterval) {
        animInterval = setInterval(() => {
          frame = (frame + 1) % 4; // 4フレームのスプライト想定
          char.style.backgroundPosition = `-${frame * 64}px 0px`;
          if (walking) {
            posX += 5 * direction;
            if(posX < 0) posX = 0;
            if(posX > window.innerWidth - 64) posX = window.innerWidth - 64;
            char.style.left = posX + "px";
          }
        }, 150);
      }
    }

    function stopWalking() {
      walking = false;
      char.style.backgroundPosition = "0 0";
      clearInterval(animInterval);
      animInterval = null;
    }

    document.getElementById("leftBtn").addEventListener("mousedown", () => startWalking(-1));
    document.getElementById("leftBtn").addEventListener("mouseup", stopWalking);
    document.getElementById("leftBtn").addEventListener("mouseleave", stopWalking);

    document.getElementById("rightBtn").addEventListener("mousedown", () => startWalking(1));
    document.getElementById("rightBtn").addEventListener("mouseup", stopWalking);
    document.getElementById("rightBtn").addEventListener("mouseleave", stopWalking);

    // タッチ端末用にtouchイベントも対応（おまけ）
    document.getElementById("leftBtn").addEventListener("touchstart", (e) => { e.preventDefault(); startWalking(-1); });
    document.getElementById("leftBtn").addEventListener("touchend", (e) => { e.preventDefault(); stopWalking(); });
    document.getElementById("rightBtn").addEventListener("touchstart", (e) => { e.preventDefault(); startWalking(1); });
    document.getElementById("rightBtn").addEventListener("touchend", (e) => { e.preventDefault(); stopWalking(); });
  </script>
</body>
</html>
