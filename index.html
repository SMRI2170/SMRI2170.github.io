<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>魔法書プロフィール</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      background: linear-gradient(#2c2c2c, #1a1a1a);
      font-family: 'serif';
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .book {
      perspective: 2000px;
    }

    .page {
      width: 600px;
      height: 400px;
      background: #fef7e0;
      color: #000;
      position: absolute;
      transform-origin: left;
      transition: transform 1s;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      padding: 20px;
      box-sizing: border-box;
    }

    .page:nth-child(1) { z-index: 3; background: #8b4513; color: #fff; }
    .page:nth-child(2) { z-index: 2; }
    .page:nth-child(3) { z-index: 1; }

    .book:hover .page:nth-child(2) {
      transform: rotateY(-160deg);
    }

    .book:hover .page:nth-child(3) {
      transform: rotateY(-160deg);
      transition-delay: 0.3s;
    }

    h1 {
      font-size: 24px;
      margin-top: 0;
    }
    ul {
      list-style: none;
      padding-left: 0;
    }
    ul li::before {
      content: '\2605';
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="book">
    <div class="page">
      <h1>魔法書：プロフィール</h1>
      <p>ようこそ、私の魔法書へ。</p>
      <p>名前：吉岡龍佑<br>学歴：立命館大学 情報理工学部</p>
    </div>
    <div class="page">
      <h1>スキルツリー</h1>
      <ul>
        <li>Python（機械学習・IoT）</li>
        <li>JavaScript / React</li>
        <li>Webデザイン / UI UX</li>
        <li>ブロックチェーン / ZKP</li>
      </ul>
    </div>
    <div class="page">
      <h1>プロジェクト</h1>
      <p>⚔️ AIで顔属性解析 / YOLO・SSRNet 使用</p>
      <p>🌱 IoT × ZKP によるプライバシー保護型センシング</p>
      <p>🎥 動画：<a href="#">プロジェクト紹介動画</a></p>
    </div>
  </div>
</body>
</html>
