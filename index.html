<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宇宙レトロゲーム風サイト</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Press Start 2P', cursive;
      background: black;
      color: #D895FF;
      overflow-x: hidden;
    }

    .starfield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 200%;
      background: repeating-radial-gradient(#D895FF 1px, transparent 2px);
      animation: starscroll 60s linear infinite;
      z-index: -1;
    }

    @keyframes starscroll {
      from { background-position: 0 0; }
      to { background-position: 0 1000px; }
    }

    header {
      text-align: center;
      padding: 50px 20px;
    }

    .ship {
      position: fixed;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 50px;
      background: url('https://i.imgur.com/Ox1Z6bo.png') no-repeat center;
      background-size: contain;
      image-rendering: pixelated;
      z-index: 2;
    }

    section {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
    }

    .enemy {
      width: 40px;
      height: 40px;
      background: url('https://i.imgur.com/kpHWjHt.png') no-repeat center;
      background-size: contain;
      image-rendering: pixelated;
      animation: float 2s ease-in-out infinite alternate;
    }

    @keyframes float {
      from { transform: translateY(0); }
      to { transform: translateY(10px); }
    }

    footer {
      padding: 40px;
      text-align: center;
      font-size: 10px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="starfield"></div>

  <header>
    <h1>🚀 宇宙ドット冒険へようこそ！</h1>
    <p>スクロールして進もう！</p>
  </header>

  <div class="ship"></div>

  <section>
    <div class="enemy"></div>
  </section>

  <section>
    <p>中ボスエリアへ接近中…</p>
  </section>

  <section>
    <div class="enemy"></div>
    <div class="enemy" style="margin-left: 60px;"></div>
  </section>

  <section>
    <h2>🚨 ボス出現！</h2>
    <p>最後までスクロールして倒そう！</p>
  </section>

  <footer>
    <p>© 2025 ドットシップ開発団</p>
  </footer>

</body>
</html>
