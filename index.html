<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>レトロドットWeb</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #000;
      color: #D895FF; /* 明るめの紫 */
      font-family: 'Press Start 2P', cursive;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      background-color: #222;
      padding: 20px;
      border-bottom: 4px solid #D895FF;
    }

    h1 {
      font-size: 20px;
      animation: blink 1s steps(2, start) infinite;
    }

    @keyframes blink {
      to {
        visibility: hidden;
      }
    }

    main {
      padding: 40px 20px;
    }

    .pixel-button {
      background-color: #D895FF;
      color: #000;
      padding: 10px 20px;
      border: 4px solid #fff;
      display: inline-block;
      font-size: 12px;
      margin-top: 20px;
      cursor: pointer;
      image-rendering: pixelated;
    }

    .pixel-button:hover {
      background-color: #fff;
      color: #D895FF;
    }

    footer {
      font-size: 10px;
      margin-top: 40px;
      color: #888;
    }
  </style>
</head>
<body>
  <header>
    <h1>★ レトロドットWebへようこそ！ ★</h1>
  </header>
  <main>
    <p>まるで80年代のゲーム画面のようなスタイル！</p>
    <div class="pixel-button">スタート</div>
  </main>
  <footer>
    <p>© 2025 ドットデザイン制作</p>
  </footer>
</body>
</html>
