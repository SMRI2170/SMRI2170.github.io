<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>宇宙プロフィール 拡張版</title>
  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Courier New', monospace;
      scroll-behavior: smooth;
      overflow-x: hidden;
    }
    section {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      position: relative;
      text-align: center;
      padding: 2em;
    }
    .title {
      font-size: 2.5em;
      margin-bottom: 1em;
    }

    /* スキル惑星 */
    .planet {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #8e44ad;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      cursor: pointer;
      animation: orbit 12s linear infinite;
      position: absolute;
    }
    @keyframes orbit {
      0% { transform: rotate(0deg) translateX(200px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(200px) rotate(-360deg); }
    }

    /* ポップアップ */
    .popup {
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.9);
      padding: 2em;
      border-radius: 12px;
      display: none;
      z-index: 10;
      border: 1px solid #fff;
    }

    /* ロケット */
    .rocket {
      width: 80px;
      animation: fly 8s linear forwards;
    }
    @keyframes fly {
      0% { transform: translateY(100vh); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(0); }
    }
    .smoke {
      position: absolute;
      width: 20px;
      height: 20px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      bottom: 10px;
      animation: smoke 3s linear infinite;
    }
    @keyframes smoke {
      0% { transform: translateY(0) scale(1); opacity: 0.6; }
      100% { transform: translateY(-100px) scale(2); opacity: 0; }
    }

    /* 衛星 */
    .satellite {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #3498db;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: satelliteOrbit 10s linear infinite;
      position: absolute;
      cursor: pointer;
    }
    @keyframes satelliteOrbit {
      0% { transform: rotate(0deg) translateX(180px) rotate(-0deg); }
      100% { transform: rotate(360deg) translateX(180px) rotate(-360deg); }
    }

    .satellite video {
      display: none;
      width: 240px;
      border: 2px solid white;
      border-radius: 10px;
    }

    /* SNS基地 */
    .sns-btn {
      margin: 1em;
      padding: 1em 2em;
      background: #2ecc71;
      border: none;
      border-radius: 30px;
      font-size: 1.2em;
      cursor: pointer;
      animation: landing 2s ease-in-out;
    }
    @keyframes landing {
      0% { transform: scale(0.2); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

<!-- ポップアップ -->
<div id="popup" class="popup"></div>

<!-- スキル -->
<section>
  <div class="title">🪐 スキルの惑星</div>
  <div class="planet" style="top: 30%;" onclick="showSkill('React', 'UIライブラリ、SPA構築')">React</div>
  <div class="planet" style="top: 50%;" onclick="showSkill('Python', 'データ分析、AI、IoT連携')">Python</div>
  <div class="planet" style="top: 70%;" onclick="showSkill('IoT', 'センサ、ESP32、ZKP連携')">IoT</div>
</section>

<!-- ロケット -->
<section>
  <div class="title">🚀 ロケット進学タイムライン</div>
  <audio id="rocket-sound" src="https://www.soundjay.com/mechanical/rocket-flyby-01.mp3" preload="auto"></audio>
  <img class="rocket" src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Emoji_u1f680.svg/120px-Emoji_u1f680.svg.png"
       onload="document.getElementById('rocket-sound').play()" />
  <div class="smoke" style="left: 48%;"></div>
</section>

<!-- プロジェクト -->
<section>
  <div class="title">🛰️ プロジェクト衛星</div>
  <div class="satellite" style="top: 200px; left: 50%;" 
       onmouseover="showVideo('project1')" onmouseout="hideVideo('project1')">
    IoT
    <video id="project1" src="https://www.w3schools.com/html/mov_bbb.mp4" muted autoplay loop></video>
  </div>
</section>

<!-- SNS -->
<section>
  <div class="title">🌍 SNS宇宙基地</div>
  <audio id="beep" src="https://www.soundjay.com/button/beep-07.wav" preload="auto"></audio>
  <button class="sns-btn" onclick="launchSNS('https://github.com/ryosukeyoshioka')">GitHub</button>
  <button class="sns-btn" onclick="launchSNS('https://qiita.com/ryosukeyoshioka')">Qiita</button>
</section>

<script>
  // スキルポップアップ
  function showSkill(title, desc) {
    const popup = document.getElementById('popup');
    popup.innerHTML = `<h2>${title}</h2><p>${desc}</p><button onclick="popup.style.display='none'">閉じる</button>`;
    popup.style.display = 'block';
  }

  // 衛星ホバーで動画表示
  function showVideo(id) {
    document.getElementById(id).style.display = 'block';
  }

  function hideVideo(id) {
    document.getElementById(id).style.display = 'none';
  }

  // SNS着陸音
  function launchSNS(url) {
    const beep = document.getElementById('beep');
    beep.play();
    setTimeout(() => {
      window.open(url, '_blank');
    }, 500); // 音が鳴ってから移動
  }
</script>

</body>
</html>
