<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>自己PR - Y2Kレトロ風</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  body {
    background: linear-gradient(135deg, #1e1e2f, #4a3e6f);
    color: #e0e0e0;
    font-family: 'Press Start 2P', monospace;
    margin: 0;
    padding: 20px;
  }

  header {
    text-align: center;
    padding: 30px 0;
    border-bottom: 3px solid #a0f0f0;
    text-shadow: 2px 2px #008080;
  }

  header h1 {
    font-size: 2.5rem;
    letter-spacing: 0.15em;
    color: #00fff7;
  }

  main {
    max-width: 800px;
    margin: 40px auto;
    background: rgba(0, 128, 128, 0.15);
    border: 3px solid #00fff7;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 0 12px #00fff7;
  }

  section {
    margin-bottom: 30px;
  }

  h2 {
    font-size: 1.6rem;
    border-bottom: 2px dashed #00fff7;
    padding-bottom: 10px;
    margin-bottom: 15px;
    color: #40ffff;
  }

  p {
    font-size: 1rem;
    line-height: 1.6;
    color: #b0f7f7;
  }

  /* レトロなビット風アイコン(シンプルに) */
  .icon {
    width: 48px;
    height: 48px;
    background: #00fff7;
    margin-right: 10px;
    display: inline-block;
    clip-path: polygon(
      25% 0%, 75% 0%, 100% 25%, 100% 75%, 75% 100%, 25% 100%, 0% 75%, 0% 25%
    );
    box-shadow: inset 0 0 4px #004040, 0 0 6px #00fff7;
  }

  /* ボタン風リンク */
  a.button {
    display: inline-block;
    padding: 12px 28px;
    margin-top: 10px;
    color: #004040;
    background: #00fff7;
    font-family: 'Press Start 2P', monospace;
    font-size: 0.9rem;
    text-decoration: none;
    border: 3px solid #004040;
    border-radius: 8px;
    box-shadow: 0 0 8px #00fff7;
    transition: all 0.3s ease;
  }

  a.button:hover {
    background: #004040;
    color: #00fff7;
    box-shadow: 0 0 12px #40ffff;
    border-color: #40ffff;
  }

  /* 粗いビットフォント風文字装飾 */
  .bit-text {
    letter-spacing: 0.12em;
    font-weight: 700;
    text-shadow:
      1px 1px 0 #004040,
      2px 2px 0 #002020;
  }

  /* レスポンシブ */
  @media (max-width: 600px) {
    body {
      padding: 10px;
    }
    main {
      padding: 20px;
      border-width: 2px;
      box-shadow: 0 0 8px #00fff7;
    }
  }
</style>
</head>
<body>
<header>
  <h1 class="bit-text">Y2K レトロ 自己PR</h1>
</header>

<main>
  <section>
    <h2 class="bit-text">プロフィール <span class="icon"></span></h2>
    <p>はじめまして。私は〇〇と申します。プログラミングとデザインが得意で、特にレトロでスタイリッシュなUI/UXを作るのが好きです。</p>
  </section>

  <section>
    <h2 class="bit-text">スキルセット <span class="icon"></span></h2>
    <p>HTML, CSS, JavaScript, Python, OpenCVなどを使い、Webサイトやアプリケーションを開発します。<br>
    デザインではY2K・レトロスタイルにこだわり、ビットフォントやメタリックなカラーを活用します。</p>
  </section>

  <section>
    <h2 class="bit-text">連絡先 <span class="icon"></span></h2>
    <p>メール: example@example.com<br>
    GitHub: <a href="https://github.com/yourusername" class="button" target="_blank" rel="noopener noreferrer">GitHubをみる</a></p>
  </section>
</main>
</body>
</html>
