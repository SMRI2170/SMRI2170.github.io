<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>背景画像に文字表示</title>
<style>
  body, html {
    margin: 0; padding: 0; height: 100%;
  }
  .background {
    position: relative;
    width: 100%;
    height: 100vh; /* 画面全体の高さ */
    background-image: url('15665_0.jpg'); /* 背景画像のパス */
    background-size: cover;
    background-position: center;
  }
  .text-overlay {
    position: absolute;
    top: 50%;  /* 縦中央 */
    left: 50%; /* 横中央 */
    transform: translate(-50%, -50%);
    color: white;  /* 文字色 */
    font-size: 48px;
    font-weight: bold;
    font-family: 'Arial', sans-serif;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.7); /* 文字の影で見やすく */
  }
</style>
</head>
<body>

<div class="background">
  <div class="text-overlay">RYOSUKE YOSHIOKA</div>
</div>

</body>
</html>
