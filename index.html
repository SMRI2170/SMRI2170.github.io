<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>宇宙プロフィール</title>
  <style>
    body {
      margin: 0;
      background: black;
      font-family: 'Courier New', monospace;
      color: white;
      overflow-x: hidden;
    }

    section {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      position: relative;
      text-align: center;
      padding: 2em;
    }

    .stars, .planet, .rocket, .satellite {
      position: absolute;
    }

    .title {
      font-size: 3em;
      margin-bottom: 0.5em;
      color: #f0f0f0;
    }

    /* 404 Section */
    #notfound {
      background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
    }

    .astronaut {
      font-size: 4em;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    /* Skill Planets */
    .planet {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #8e44ad;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      position: absolute;
      animation: orbit 10s linear infinite;
    }

    @keyframes orbit {
      0% { transform: rotate(0deg) translateX(200px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(200px) rotate(-360deg); }
    }

    /* Rocket Timeline */
    .rocket {
      top: 0;
      width: 80px;
      animation: fly 10s linear forwards;
    }

    @keyframes fly {
      0% { top: 100%; }
      100% { top: 0%; }
    }

    .timeline {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1em;
    }

    .timeline-item {
      background: #222;
      padding: 1em;
      border-radius: 10px;
      width: 300px;
    }

    /* Satellites */
    .satellite {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #3498db;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      animation: satelliteOrbit 8s linear infinite;
      cursor: pointer;
    }

    @keyframes satelliteOrbit {
      0% { transform: rotate(0deg) translateX(150px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(150px) rotate(-360deg); }
    }

    .tooltip {
      position: absolute;
      background: rgba(0,0,0,0.7);
      padding: 0.5em;
      border-radius: 8px;
      font-size: 0.9em;
      display: none;
    }

    /* Space base buttons */
    .sns-btn {
      margin: 1em;
      padding: 0.8em 1.5em;
      border: none;
      border-radius: 25px;
      background: #27ae60;
      color: white;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.3s;
    }

    .sns-btn:hover {
      background: #1e8449;
    }
  </style>
</head>
<body>

<section id="notfound">
  <div class="astronaut">👨‍🚀</div>
  <div class="title">404: 宇宙でページを見失いました</div>
  <p>スクロールして宇宙プロフィールを発見！</p>
</section>

<section id="skills">
  <div class="title">🪐 スキルの惑星</div>
  <div class="planet" style="top: 0; left: 50%;">React</div>
  <div class="planet" style="top: 30%; left: 20%;">Python</div>
  <div class="planet" style="top: 60%; left: 70%;">IoT</div>
</section>

<section id="education">
  <div class="title">🚀 学歴ロケットの航跡</div>
  <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Emoji_u1f680.svg/120px-Emoji_u1f680.svg.png" class="rocket" />
  <div class="timeline">
    <div class="timeline-item">2019年 - 立命館大学 情報理工学部 入学</div>
    <div class="timeline-item">2023年 - 卒業研究「ZKPとIoT」</div>
    <div class="timeline-item">2025年 - 修士課程 修了予定</div>
  </div>
</section>

<section id="projects">
  <div class="title">🛰️ プロジェクト衛星</div>
  <div class="satellite" style="top: 150px; left: 50%;" 
       onmouseover="showTooltip(event, '顔認識による年齢・性別推定')" 
       onmouseout="hideTooltip()">AI分析</div>
  <div class="satellite" style="top: 250px; left: 30%;" 
       onmouseover="showTooltip(event, 'スマート養殖システム（IoT）')" 
       onmouseout="hideTooltip()">IoT</div>
  <div id="tooltip" class="tooltip"></div>
</section>

<section id="sns">
  <div class="title">🌍 宇宙基地リンク</div>
  <button class="sns-btn" onclick="window.open('https://github.com/ryosukeyoshioka')">GitHub</button>
  <button class="sns-btn" onclick="window.open('https://qiita.com/ryosukeyoshioka')">Qiita</button>
</section>

<script>
  function showTooltip(e, text) {
    const tooltip = document.getElementById('tooltip');
    tooltip.style.display = 'block';
    tooltip.style.left = `${e.pageX + 10}px`;
    tooltip.style.top = `${e.pageY - 30}px`;
    tooltip.textContent = text;
  }
  function hideTooltip() {
    document.getElementById('tooltip').style.display = 'none';
  }
</script>

</body>
</html>
