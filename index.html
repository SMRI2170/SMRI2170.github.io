<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>プロフィール</title>
  <style>
    body {
      font-family: 'Helvetica Neue', sans-serif;
      background-color: #f4f4f4;
      color: #333;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .profile-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      text-align: center;
      padding: 40px;
      max-width: 400px;
      width: 90%;
    }

    .profile-card img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 20px;
    }

    .profile-card h1 {
      font-size: 24px;
      margin: 10px 0;
    }

    .profile-card p {
      font-size: 16px;
      color: #666;
      margin: 10px 0 20px;
    }

    .profile-card a {
      display: inline-block;
      margin: 5px 10px;
      text-decoration: none;
      color: #0077cc;
      font-weight: bold;
    }

    .profile-card a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="profile-card">
    <img src="15665_0.jpg" alt="プロフィール画像" />
    <h1>吉岡 龍佑</h1>
    <p>情報理工学部の学生。IoTや機械学習に興味があります。</p>
    <a href="https://github.com/yourusername" target="_blank">GitHub</a>
    <a href="https://twitter.com/yourusername" target="_blank">Twitter</a>
  </div>
</body>
</html>
